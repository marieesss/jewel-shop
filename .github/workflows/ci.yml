# Intégration continue : compile et teste l'API et le front.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions

# Deux pushs rapprochés sur la même PR : on annule le run devenu obsolète.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Le jeton GITHUB_TOKEN de ce workflow peut seulement lire le code.
permissions:
  contents: read

jobs:

  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jewel-api
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le SDK .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restaurer les paquets NuGet
        run: dotnet restore JewelryShop.sln

      # Règles de .editorconfig (racine du repo). Pour corriger : dotnet format JewelryShop.sln
      - name: Vérifier le formatage
        run: dotnet format JewelryShop.sln --verify-no-changes --no-restore

      - name: Compiler
        run: dotnet build JewelryShop.sln --configuration Release --no-restore

      # Tests unitaires et tests d'intégration. Ces derniers lancent PostgreSQL avec Testcontainers,
      # sur le Docker déjà installé sur les runners ubuntu-latest.
      - name: Tester
        run: dotnet test JewelryShop.sln --configuration Release --no-build --verbosity normal

  front:
    name: Front (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jewel-front
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js (version de .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: jewel-front/.nvmrc
          cache: npm
          cache-dependency-path: jewel-front/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      # Pour corriger : npm run format
      - name: Vérifier le formatage
        run: npm run format:check

      - name: Vérifier les types et construire
        run: npm run build

      - name: Tests unitaires
        run: npm test

  # ── Publication des images Docker sur ghcr.io ───────────────────────────────
  publish:
    name: Image ${{ matrix.image }}
    needs: [api, front] # seulement si les deux jobs de tests ont réussi
    # Pas de publication pour une pull request : uniquement pour ce qui arrive sur main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # autorise GITHUB_TOKEN à pousser sur ghcr.io
    strategy:
      matrix:
        include:
          - image: jewel-api
            context: jewel-api
          - image: jewel-front
            context: jewel-front
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Activer Buildx (moteur de build Docker avec cache)
        uses: docker/setup-buildx-action@v4

      - name: Se connecter à ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les tags et labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # ── Déploiement continu sur Kubernetes ──────────────────────────────────────
  # Les deux environnements suivent la même procédure : .github/workflows/deploy-k8s.yml.
  deploy-staging:
    name: Staging
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-k8s.yml
    with:
      environment: staging
      url: https://staging.mycharmly.eu
    secrets: inherit              # transmet les secrets ; ceux de l'environnement sont lus dans le job

  deploy-production:
    name: Production
    needs: deploy-staging         # uniquement si le staging est déployé ET ses tests de fumée passent
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-k8s.yml
    with:
      environment: production     # "Required reviewers" : attend ta validation dans GitHub
      url: https://mycharmly.eu
    secrets: inherit
