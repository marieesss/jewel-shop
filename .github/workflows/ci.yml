# Intégration continue : compile et teste l'API et le front.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions

# Deux pushs rapprochés sur la même PR : on annule le run devenu obsolète.
# Jamais sur main : on n'interrompt pas un déploiement en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Le jeton GITHUB_TOKEN de ce workflow peut seulement lire le code.
permissions:
  contents: read

jobs:

  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jewel-api
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le SDK .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restaurer les paquets NuGet
        run: dotnet restore JewelryShop.sln

      - name: Compiler
        run: dotnet build JewelryShop.sln --configuration Release --no-restore

      - name: Tester
        run: dotnet test JewelryShop.sln --configuration Release --no-build --verbosity normal

  front:
    name: Front (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jewel-front
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jewel-front/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types et construire
        run: npm run build

  # ── Publication des images Docker sur ghcr.io ───────────────────────────────
  publish:
    name: Image ${{ matrix.image }}
    needs: [api, front] # seulement si les deux jobs de tests ont réussi
    # Pas de publication pour une pull request : uniquement pour ce qui arrive sur main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # autorise GITHUB_TOKEN à pousser sur ghcr.io
    strategy:
      matrix:
        include:
          - image: jewel-api
            context: jewel-api
          - image: jewel-front
            context: jewel-front
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Activer Buildx (moteur de build Docker avec cache)
        uses: docker/setup-buildx-action@v4

      - name: Se connecter à ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les tags et labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # ── Déploiement sur le serveur ──────────────────────────────────────────────
  deploy:
    name: Déploiement production
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Les secrets de l'environnement "production" ne sont accessibles qu'ici.
    environment:
      name: production
      url: https://mycharmly.eu
    # Un seul déploiement à la fois ; le suivant attend au lieu d'annuler.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read # GITHUB_TOKEN pourra télécharger les images privées
    env:
      TARGET: deploy@${{ vars.DEPLOY_HOST }}
      APP_DIR: /srv/jewel-app
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Empreinte du serveur connue d'avance : refuse un faux serveur.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copier la configuration
        run: |
          ssh "$TARGET" "mkdir -p $APP_DIR/scripts $APP_DIR/backups && chmod 700 $APP_DIR/backups"
          scp deploy/compose.prod.yaml "$TARGET:$APP_DIR/compose.yaml"
          scp deploy/gateway/nginx.conf "$TARGET:$APP_DIR/gateway/nginx.conf"
          scp deploy/pgadmin/servers.json "$TARGET:$APP_DIR/pgadmin/servers.json"
          scp deploy/scripts/* "$TARGET:$APP_DIR/scripts/"
          ssh "$TARGET" "chmod 750 $APP_DIR/scripts/*.sh"

      - name: Écrire le .env
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PGADMIN_EMAIL: ${{ secrets.PGADMIN_EMAIL }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
        # Le contenu passe par l'entrée standard de ssh : il n'apparaît ni dans
        # les logs ni dans la liste des processus du serveur. umask 077 = fichier lisible par deploy seul.
        run: |
          ssh "$TARGET" "umask 077 && cat > $APP_DIR/.env" <<EOF
          IMAGE_TAG=${{ github.sha }}
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          JWT_SECRET=$JWT_SECRET
          CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
          CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
          CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
          PGADMIN_EMAIL=$PGADMIN_EMAIL
          PGADMIN_PASSWORD=$PGADMIN_PASSWORD
          EOF

      - name: Écrire le mot de passe Nginx de pgAdmin
        env:
          BA_USER: ${{ secrets.PGADMIN_BASIC_AUTH_USER }}
          BA_PASSWORD: ${{ secrets.PGADMIN_BASIC_AUTH_PASSWORD }}
        # Le hash est calculé sur le runner ; seul le hash part sur le serveur.
        # umask 027 : fichier 640 ; le dossier (setgid, groupe www-data) le rend lisible par Nginx.
        # Nginx relit ce fichier à chaque requête : aucun rechargement nécessaire.
        run: |
          printf '%s:%s\n' "$BA_USER" "$(openssl passwd -apr1 "$BA_PASSWORD")" \
            | ssh "$TARGET" "umask 027 && cat > /etc/nginx/jewel/pgadmin.htpasswd"

      - name: Mettre à jour les conteneurs
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "$TARGET" bash -s <<EOF
          set -euo pipefail
          cd $APP_DIR
          # Le jeton du run (valable quelques minutes) est oublié du serveur en sortie, même en cas d'échec.
          trap 'docker logout ghcr.io >/dev/null' EXIT
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull

          # 1. Sauvegarde avant toute modification (sauf au tout premier déploiement).
          if [ -n "\$(docker compose ps --status running --quiet db)" ]; then
            ./scripts/backup.sh pre-deploy-${GITHUB_SHA::7}
          fi

          # 2. Base démarrée, puis migrations dans un conteneur jetable de la NOUVELLE image.
          #    Si elles échouent, le script s'arrête ici : l'ancienne API tourne toujours.
          docker compose up -d --wait db
          ./scripts/sync-db-password.sh
          docker compose run --rm --no-deps api --migrate

          # 3. Remplacement des conteneurs. --wait : échoue s'ils ne sont pas "healthy" en 3 min.
          docker compose up -d --remove-orphans --wait --wait-timeout 180

          # 4. Sauvegarde nocturne (remplace la crontab de deploy par celle du repo).
          crontab scripts/crontab
          # Supprime NOS anciennes images de plus de 3 jours (label posé par metadata-action),
          # sans jamais toucher à celles d'italian-app.
          docker image prune -af \
            --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --filter "until=72h"
          docker compose ps
          EOF

      - name: Vérifier le site public
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            -o /dev/null -w "https://mycharmly.eu/api/chains -> %{http_code}\n" \
            https://mycharmly.eu/api/chains
