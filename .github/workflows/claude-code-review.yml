# Revue de code automatique des PR, au regard des règles de CONTRIBUTING.md : bugs, sécurité, tests, clean code, performances.
# Relancer une revue : ajouter le label `claude-review` sur la PR (le retirer puis le remettre s'il y est déjà).
name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/package-lock.json'
      - '**/*.lock'

# Une seule revue à la fois par PR : la plus récente remplace celle en cours.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Pas de revue sur les brouillons ni les PR de bots ; un label ne relance que s'il s'agit de `claude-review`.
    if: >
      github.event.pull_request.draft == false &&
      !endsWith(github.actor, '[bot]') &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Diff réduit au code relu : sans lockfiles, migrations générées, fichiers minifiés ni snapshots.
      - name: Préparer un diff filtré
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- . \
            ':(exclude)*.lock' ':(exclude)**/package-lock.json' \
            ':(exclude)**/Migrations/**' ':(exclude)**/*.min.*' \
            ':(exclude)**/*.snap' > pr.diff
          echo "lines=$(wc -l < pr.diff)" >> "$GITHUB_OUTPUT"

      - name: Signaler un diff trop gros
        if: fromJSON(steps.diff.outputs.lines) >= 1500
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "Revue automatique non lancée : le diff filtré fait ${{ steps.diff.outputs.lines }} lignes (limite : 1500). Découpez la PR ou relisez-la à la main."

      - name: Revue
        if: fromJSON(steps.diff.outputs.lines) > 0 && fromJSON(steps.diff.outputs.lines) < 1500
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Tu es un développeur senior de ce projet et tu relis la PR
            #${{ github.event.pull_request.number }} de ${{ github.repository }} avant son merge.
            Tu juges le code avec exigence, en t'appuyant sur les règles écrites du
            repo, pas sur tes goûts personnels.

            Sources, à lire dans cet ordre :
            1. ./pr.diff : le diff filtré de la PR.
            2. ./CONTRIBUTING.md : les règles qui font foi. Lis seulement les sections
               utiles au diff : organisation de l'API et du front, lisibilité du code
               et commentaires, tests unitaires, données et migrations,
               « Ne pas casser la production », secrets et sécurité.
            3. ./docs/architecture.md, si le diff ajoute ou déplace des fichiers.
            N'explore pas le reste du repo, sauf si une ligne est impossible à juger
            sans son contexte.

            Ce que tu juges, du plus grave au moins grave :
            1. Bugs, failles de sécurité, risques pour la production (migration non
               rétrocompatible, API cassante, fonctionnalité incomplète visible).
            2. Tests manquants ou trop faibles au regard des règles de tests du repo.
            3. Clean code au sens du repo : responsabilités mal placées par rapport à
               l'architecture décrite, duplication, nommage peu clair ou contraire
               aux conventions, fonctions trop longues ou trop imbriquées,
               commentaires qui ne respectent pas les règles de lisibilité.
            4. Performances, quand le coût est réel (requête en boucle, chargement
               inutile, rendu répété).
            Ignore le formatage, que les outils de lint vérifient déjà.

            Forme des commentaires :
            - 5 commentaires inline maximum, en français, garde les plus importants.
            - Chacun commence par sa gravité (« Bloquant », « À corriger » ou
              « Suggestion »). Il dit ce qui ne va pas et pourquoi, en citant la
              règle de CONTRIBUTING.md concernée quand il y en a une, puis comment
              corriger. Deux à quatre phrases.
            - Pas de résumé de la PR, pas de compliments.
            - S'il n'y a rien d'important : un seul commentaire « RAS ».
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 8
            --allowedTools "Read,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"
