# JewelryShop — toute l'application en une commande :  docker compose up -d --build
# Les valeurs secrètes viennent du fichier .env (non versionné, voir .env.example).

name: jewel-app

services:

  # ── Base de données ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jewelryshop
      POSTGRES_USER: jewel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # $$ = un $ littéral : la variable est lue DANS le conteneur, pas par Compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    # Aucun "ports:" : la base n'est joignable que par les services du réseau backend.

  # ── API .NET ────────────────────────────────────────────────────────────────
  api:
    build: ./jewel-api
    image: jewel-api:local
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=jewelryshop;Username=jewel;Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      Jwt__Issuer: JewelryShop
      Jwt__Audience: JewelryShop
      Jwt__ExpiresInDays: "7"
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME manquant dans .env}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY manquant dans .env}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET manquant dans .env}
    depends_on:
      db:
        condition: service_healthy   # attend que pg_isready réponde, pas juste que le conteneur existe
    networks: [backend, edge]

  # ── Front React (fichiers statiques servis par Nginx) ───────────────────────
  front:
    build: ./jewel-front
    image: jewel-front:local
    restart: unless-stopped
    networks: [edge]

  # ── Passerelle : point d'entrée unique, route /api → api et / → front ───────
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      api:
        condition: service_healthy
      front:
        condition: service_healthy
    networks: [edge]

  # ── pgAdmin : interface web pour consulter la base ──────────────────────────
  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL manquant dans .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD manquant dans .env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./deploy/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:8092:80"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, edge]

volumes:
  db-data:        # données Postgres : survivent à "docker compose down"
  pgadmin-data:   # comptes et préférences pgAdmin

networks:
  # internal: aucun accès Internet, et rien ne peut y être publié vers l'hôte.
  backend:
    internal: true
  edge: {}
