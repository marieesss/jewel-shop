server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Fichiers de build Vite : leur nom contient un hash, ils peuvent être cachés 1 an.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application monopage : toute route inconnue (/admin/products, /favorites…)
    # renvoie index.html, et React Router affiche la bonne page.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
