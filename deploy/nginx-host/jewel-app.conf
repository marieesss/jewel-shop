# Site Nginx du SERVEUR (pas un conteneur) pour JewelryShop.
# Installé une seule fois par 05-preparer-serveur.sh dans /etc/nginx/sites-available/jewel-app,
# puis complété par certbot (blocs 443 + redirection HTTP→HTTPS ajoutés automatiquement).
# Ce fichier est inclus dans le bloc http de Nginx, à côté du site italian-app.

# Limitation de débit pour pgAdmin : 10 requêtes/s par IP, rafale de 40 tolérée.
limit_req_zone $binary_remote_addr zone=jewel_pgadmin:10m rate=10r/s;

# ── Application : mycharmly.eu ───────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mycharmly.eu www.mycharmly.eu;

    client_max_body_size 10m;   # uploads d'images produits

    location / {
        proxy_pass http://127.0.0.1:8090;   # passerelle du Compose jewel-app
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Valeur unique et fiable (on écrase ce que le client aurait pu envoyer).
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── pgAdmin : pgadmin.mycharmly.eu ───────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name pgadmin.mycharmly.eu;

    location / {
        limit_req zone=jewel_pgadmin burst=40 nodelay;

        # Première serrure, gérée par Nginx avant même d'atteindre pgAdmin.
        auth_basic           "Administration JewelryShop";
        # Écrit à chaque déploiement par GitHub Actions (secrets PGADMIN_BASIC_AUTH_*).
        # Dossier appartenant à deploy, groupe www-data : deploy écrit, Nginx lit.
        auth_basic_user_file /etc/nginx/jewel/pgadmin.htpasswd;

        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les identifiants basic auth s'arrêtent ici : pgAdmin n'a pas à les voir.
        proxy_set_header Authorization     "";
    }
}
