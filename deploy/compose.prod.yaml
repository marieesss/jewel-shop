# JewelryShop — production. Copié sur le serveur en /srv/jewel-app/compose.yaml
# par le workflow de déploiement ; le .env à côté est écrit par ce même workflow.
# Différences avec le compose.yaml local : images ghcr.io (pas de build),
# limites mémoire, rotation des logs.

name: jewel-app

# Bloc réutilisable (ancre YAML) : Docker garde au plus 3 fichiers de 10 Mo de logs
# par conteneur. Sans ça, les logs grossissent jusqu'à remplir le disque.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jewelryshop
      POSTGRES_USER: jewel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    image: ghcr.io/marieesss/jewel-api:${IMAGE_TAG:?IMAGE_TAG manquant dans .env}
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=jewelryshop;Username=jewel;Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      Jwt__Issuer: JewelryShop
      Jwt__Audience: JewelryShop
      Jwt__ExpiresInDays: "7"
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME manquant dans .env}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY manquant dans .env}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET manquant dans .env}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Les migrations sont jouées par le déploiement (api --migrate), pas au démarrage.
      Database__MigrateOnStartup: "false"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, edge]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 384M

  front:
    image: ghcr.io/marieesss/jewel-front:${IMAGE_TAG:?IMAGE_TAG manquant dans .env}
    restart: unless-stopped
    networks: [edge]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M

  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8090:8080"   # joignable uniquement par le Nginx du serveur
    depends_on:
      api:
        condition: service_healthy
      front:
        condition: service_healthy
    networks: [edge]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL manquant dans .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD manquant dans .env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    # Données pgAdmin en mémoire (tmpfs), pas dans un volume : à chaque changement de
    # PGADMIN_EMAIL / PGADMIN_PASSWORD, le conteneur est recréé et repart des secrets GitHub.
    # On perd seulement l'historique des requêtes et les préférences.
    tmpfs:
      - /var/lib/pgadmin:uid=5050,gid=5050,mode=0700
    ports:
      - "127.0.0.1:8092:80"     # joignable uniquement par le Nginx du serveur
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, edge]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  db-data:

networks:
  backend:
    internal: true
  edge: {}
