# ClusterIssuer : une autorité de certification utilisable par tous les namespaces.
# Deux émetteurs Let's Encrypt :
#   - staging : certificats NON reconnus par les navigateurs, mais quotas très larges.
#               Pour tester la configuration sans risquer d'être bloqué.
#   - prod    : vrais certificats. Quotas stricts 


apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account   # clé du compte ACME, créée automatiquement
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
