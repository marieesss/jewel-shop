# Routage : quel domaine et quel chemin vont vers quel Service.
# Remplace le site Nginx du serveur ET la passerelle Nginx du Compose.
# Appliqué par Traefik, le contrôleur Ingress installé par k3s (ingressClassName: traefik).

# ── Middleware : redirection HTTP → HTTPS ────────────────────────────────────
# Sans effet sur une requête déjà en HTTPS. N'affecte pas le défi Let's Encrypt :
# cert-manager le sert par son propre Ingress temporaire.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: jewel-prod
spec:
  redirectScheme:
    scheme: https
    permanent: true                # 301 : le navigateur retient la redirection
---
# ── Application : mycharmly.eu ───────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jewel-app
  namespace: jewel-prod
  labels:
    app.kubernetes.io/part-of: jewel-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: jewel-prod-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mycharmly.eu
        - www.mycharmly.eu
      secretName: jewel-app-tls    # un seul certificat valable pour les deux noms
  rules:
    - host: mycharmly.eu
      http: &app-routes            # ancre YAML : mêmes routes réutilisées pour www
        paths:
          # Le préfixe le plus long l'emporte : /api/... va à l'API, tout le reste au front.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front
                port:
                  name: http
    - host: www.mycharmly.eu
      http: *app-routes
---
# ── Middlewares Traefik pour pgAdmin ─────────────────────────────────────────
# Un Middleware traite la requête AVANT qu'elle n'atteigne le Service.
# Ressource propre à Traefik (CRD), référencée depuis l'Ingress par une annotation.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pgadmin-auth
  namespace: jewel-prod
spec:
  basicAuth:
    # Secret contenant une clé "users" au format htpasswd (créé par create-secrets.sh).
    secret: pgadmin-basic-auth
    realm: Administration JewelryShop
    removeHeader: true             # pgAdmin ne reçoit pas les identifiants du basic auth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pgadmin-ratelimit
  namespace: jewel-prod
spec:
  rateLimit:
    average: 10                    # 10 requêtes/s par IP en moyenne
    burst: 40                      # rafale tolérée (chargement de la page)
---
# ── pgAdmin : pgadmin.mycharmly.eu ───────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin
  namespace: jewel-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Format : <namespace>-<nom>@kubernetescrd, séparés par des virgules SANS espace,
    # appliqués dans l'ordre : HTTPS d'abord (le mot de passe ne part jamais en clair),
    # puis limite de débit, puis mot de passe.
    traefik.ingress.kubernetes.io/router.middlewares: jewel-prod-redirect-https@kubernetescrd,jewel-prod-pgadmin-ratelimit@kubernetescrd,jewel-prod-pgadmin-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pgadmin.mycharmly.eu
      secretName: pgadmin-tls
  rules:
    - host: pgadmin.mycharmly.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgadmin
                port:
                  name: http
