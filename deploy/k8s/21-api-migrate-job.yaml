# Job : tâche ponctuelle qui s'exécute jusqu'au bout puis s'arrête.
# Équivalent de "docker compose run --rm api --migrate" de l'étape 6 :
# même image que l'API, lancée avec --migrate.
#
# Un Job terminé ne se relance pas : pour rejouer les migrations, on le supprime puis
# on le recrée (c'est ce que fera le pipeline à chaque déploiement, étape 8).
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  namespace: jewel-prod
  labels:
    app.kubernetes.io/name: api-migrate
spec:
  backoffLimit: 0                 # pas de nouvel essai : une migration ratée doit être regardée
  activeDeadlineSeconds: 300      # tuée si elle dure plus de 5 minutes
  ttlSecondsAfterFinished: 86400  # le Job et ses logs sont supprimés automatiquement après 24 h
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-migrate
    spec:
      restartPolicy: Never        # un Job ne redémarre pas son conteneur en boucle
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: migrate
          # TEMPORAIRE : "latest" le temps de l'étape 7. À l'étape 8, le pipeline posera
          # le sha exact du commit (même image pour le Job et le Deployment).
          image: ghcr.io/marieesss/jewel-api:latest
          imagePullPolicy: Always
          args: ["--migrate"]     # ajouté après l'ENTRYPOINT : dotnet JewelryShop.API.dll --migrate
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
