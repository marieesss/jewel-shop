# Postgres de production.
# Prérequis : le Secret "postgres-credentials" (clé POSTGRES_PASSWORD), créé hors du repo.

# ── Service : nom DNS stable "postgres" pour joindre la base ─────────────────
# clusterIP: None = Service "headless" : pas d'IP virtuelle ni de répartition de charge,
# le nom résout directement vers le pod. C'est le Service exigé par un StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres   # envoie vers les pods portant ce label
  ports:
    - name: postgres
      port: 5432
---
# ── StatefulSet : gère un pod qui a une identité et un stockage stables ──────
# Contrairement à un Deployment, le pod s'appelle toujours "postgres-0" et retrouve
# toujours le MÊME volume, même s'il est recréé.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:                              # modèle des pods créés par le StatefulSet
    metadata:
      labels:
        app.kubernetes.io/name: postgres
      annotations:
        # Empreinte de POSTGRES_PASSWORD (pipeline) : si le mot de passe change dans GitHub,
        # le pod redémarre et le hook postStart ci-dessous l'applique à la base.
        checksum/db-password: manual
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: jewelryshop
            - name: POSTGRES_USER
              value: jewel
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:            # lu dans le Secret, jamais écrit dans ce fichier
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            # Les données dans un SOUS-dossier du volume : initdb refuse un dossier
            # non vide, et certains volumes contiennent déjà des fichiers (ex. lost+found).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Postgres ne lit POSTGRES_PASSWORD qu'à la création de la base ; ensuite le mot
          # de passe est stocké DANS la base. Ce hook, exécuté par Kubernetes à chaque
          # démarrage du conteneur, l'y réécrit : le secret GitHub reste la source de vérité
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    # Attend le VRAI serveur : pendant l'initialisation, le serveur temporaire
                    # n'écoute pas en TCP. Connexion par le socket local (sans mot de passe).
                    for i in $(seq 1 60); do
                      if pg_isready -q -h 127.0.0.1 -U "$POSTGRES_USER"; then
                        printf 'ALTER ROLE "%s" WITH PASSWORD $pw$%s$pw$;\n' "$POSTGRES_USER" "$POSTGRES_PASSWORD" \
                          | psql -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" && exit 0
                      fi
                      sleep 2
                    done
                    exit 1
          # Équivalent du healthcheck de Compose : tant que pg_isready échoue,
          # le pod n'est pas "Ready" et ne reçoit pas de trafic.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:                    # ce que le scheduler réserve pour ce pod
              cpu: 50m                   # 5 % d'un cœur
              memory: 128Mi
            limits:                      # plafond : au-delà, le conteneur est tué et relancé
              memory: 512Mi
  # Un PVC est créé automatiquement pour chaque pod (ici : data-postgres-0).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]   # monté en écriture par un seul nœud à la fois
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 5Gi
