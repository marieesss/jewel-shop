# Redirection HTTP → HTTPS, commune à tous les environnements.
# Référencée par les Ingress via l'annotation <namespace>-redirect-https@kubernetescrd.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true                # 301 : le navigateur retient la redirection
