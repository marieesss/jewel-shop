# pgAdmin : interface web pour consulter la base de production.
# Prérequis : le Secret "pgadmin-credentials" (PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD).

# ── Connexion préenregistrée, montée comme FICHIER dans le conteneur ─────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  labels:
    app.kubernetes.io/name: pgadmin
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "JewelryShop",
          "Group": "Servers",
          "Host": "postgres",
          "Port": 5432,
          "MaintenanceDB": "jewelryshop",
          "Username": "jewel",
          "SSLMode": "prefer"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  labels:
    app.kubernetes.io/name: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pgadmin
  # Recreate : l'ancien pod est arrêté AVANT de démarrer le nouveau. Pas de mise à jour
  # sans coupure ici, mais on évite d'avoir deux pgAdmin (≈ 500 Mo) en même temps.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgadmin
    spec:
      securityContext:
        # L'image déclare son utilisateur par son NOM ("pgadmin") : Kubernetes ne peut pas
        # vérifier runAsNonRoot avec un nom, on donne donc son numéro explicitement.
        runAsNonRoot: true
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050               # les volumes montés appartiennent au groupe 5050
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9
          ports:
            - name: http
              containerPort: 8080
          env:
            # Port 8080 : un utilisateur non-root ne peut pas écouter sur le port 80.
            - name: PGADMIN_LISTEN_PORT
              value: "8080"
            - name: PGADMIN_CONFIG_SERVER_MODE
              value: "True"
          envFrom:
            - secretRef:
                name: pgadmin-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
            - name: servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json   # monte UNE clé de la ConfigMap comme un seul fichier
              readOnly: true
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 60   # pgAdmin met du temps à démarrer
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
      volumes:
        # emptyDir : dossier vide créé avec le pod et détruit avec lui. Même logique que le
        # tmpfs de l'étape 6 : chaque nouveau pod repart des identifiants du Secret.
        - name: data
          emptyDir: {}
        - name: servers
          configMap:
            name: pgadmin-servers
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  labels:
    app.kubernetes.io/name: pgadmin
spec:
  selector:
    app.kubernetes.io/name: pgadmin
  ports:
    - name: http
      port: 8080
      targetPort: http
