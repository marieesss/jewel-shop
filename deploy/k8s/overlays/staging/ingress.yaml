# Routage du STAGING : staging.mycharmly.eu, protégé par mot de passe
# (une version en cours de validation n'a pas à être publique).
#
# Deux Ingress, car l'authentification basique et le JWT de l'API utilisent tous deux
# l'en-tête Authorization : une requête du front portant "Bearer <jwt>" échouerait à
# l'authentification basique et le navigateur redemanderait le mot de passe en boucle.
#   - jewel-app     : le front et Swagger (/api/swagger), derrière l'authentification basique ;
#   - jewel-app-api : le reste de /api, sans authentification basique (le JWT protège les
#                     routes privées).

# Basic auth : Secret "staging-basic-auth" (clé "users" au format htpasswd),
# créé par le pipeline à partir des secrets GitHub de l'environnement staging.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: staging-auth
spec:
  basicAuth:
    secret: staging-basic-auth
    realm: JewelryShop staging
    removeHeader: true
---
# Demande aux moteurs de recherche de ne pas indexer le staging.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: noindex
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jewel-app
  labels:
    app.kubernetes.io/part-of: jewel-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # <namespace>-<nom>@kubernetescrd : ici le namespace est jewel-staging.
    traefik.ingress.kubernetes.io/router.middlewares: jewel-staging-redirect-https@kubernetescrd,jewel-staging-staging-auth@kubernetescrd,jewel-staging-noindex@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - staging.mycharmly.eu
      secretName: jewel-app-tls
  rules:
    - host: staging.mycharmly.eu
      http:
        paths:
          # Swagger reste derrière l'authentification basique : le préfixe le plus long l'emporte
          # sur le /api de l'Ingress jewel-app-api.
          - path: /api/swagger
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jewel-app-api
  labels:
    app.kubernetes.io/part-of: jewel-app
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: jewel-staging-redirect-https@kubernetescrd,jewel-staging-noindex@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - staging.mycharmly.eu
      # Même certificat que jewel-app, qui le fait émettre par cert-manager.
      secretName: jewel-app-tls
  rules:
    - host: staging.mycharmly.eu
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
