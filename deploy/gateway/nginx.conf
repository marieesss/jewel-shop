# Passerelle de l'application : seul point d'entrée HTTP.
# Inclus dans le bloc http de Nginx (conf.d), d'où la présence possible de "map".

# Si un proxy en amont (Nginx du serveur) indique déjà le protocole d'origine (https),
# on le conserve ; sinon on utilise celui de la requête reçue.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Même logique pour l'IP du visiteur : en prod, le Nginx du serveur la fournit déjà
# (une seule valeur, fiable) ; en local, c'est l'IP de la requête reçue.
map $http_x_forwarded_for $forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

server {
    listen 8080;
    server_name _;

    # Taille max des uploads d'images produits.
    client_max_body_size 10m;

    # DNS interne de Docker. Avec une variable dans proxy_pass, Nginx résout le nom
    # à chaque requête (cache 10 s) au lieu d'une seule fois au démarrage :
    # quand l'API est recréée avec une nouvelle IP, la passerelle la retrouve.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $api_upstream   http://api:8080;
    set $front_upstream http://front:8080;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location /api/ {
        proxy_pass $api_upstream;
    }

    location / {
        proxy_pass $front_upstream;
    }
}
