services:
  postgres:
    image: postgres:16
    container_name: jewelryshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jewelryshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jewelryshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jewelryshop-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # Faux serveur SMTP : capture les mails de l'API lancée hors Docker (Email__Smtp__Host=localhost).
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: jewelryshop-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # interface web
      - "127.0.0.1:1025:1025"   # SMTP

volumes:
  postgres_data:
